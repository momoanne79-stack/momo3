</style></head><body><div id="app"><div class="okFlash" id="okFlash">OK!</div><div class="header"><span class="label">Grammar Exercises</span><h1>문법 Unit 23~25 언스크램블</h1><p>한글 해석을 보고 단어를 순서대로 맞추세요</p></div><div class="nav"><button class="active" onclick="showTab('u23',this)">Unit23</button><button onclick="showTab('u24',this)">Unit24</button><button onclick="showTab('u25',this)">Unit25</button><button onclick="showTab('hist',this);renderHistory()">기록</button><button onclick="showTab('wrong',this);renderWrong()">오답</button></div><section id="u23" class="section active"></section><section id="u24" class="section"></section><section id="u25" class="section"></section><section id="hist" class="section"><div class="title">학습 기록</div><div class="sub" style="margin-bottom:12px">풀다가 나가도 저장된 위치부터 이어서 풀 수 있습니다.</div><div id="histList"></div></section><section id="wrong" class="section"><div class="title">오답 다시 풀기</div><div class="sub" style="margin-bottom:12px">틀린 문제는 여기 남고, 다시 맞히면 오답에서 사라집니다.</div><div id="wrongList"></div></section></div><script>
const STORE='surinamu_grammar_unit23_25_unscramble_v1';const UNIT_DATA={"u23": {"title": "Unit 23", "subtitle": "who / what 의문문", "questions": [{"id": "u23_1", "no": 1, "en": "Who drove the car?", "ko": "누가 차를 운전했니?"}, {"id": "u23_2", "no": 2, "en": "My father.", "ko": "우리 아버지야."}, {"id": "u23_3", "no": 3, "en": "What did you see there?", "ko": "너는 거기서 무엇을 보았니?"}, {"id": "u23_4", "no": 4, "en": "The Statue of Liberty.", "ko": "자유의 여신상이야."}, {"id": "u23_5", "no": 5, "en": "Who did you meet?", "ko": "너는 누구를 만났니?"}, {"id": "u23_6", "no": 6, "en": "My cousin, Sally.", "ko": "내 사촌 Sally야."}, {"id": "u23_7", "no": 7, "en": "What did you drink?", "ko": "너는 무엇을 마셨니?"}, {"id": "u23_8", "no": 8, "en": "Orange juice.", "ko": "오렌지 주스야."}, {"id": "u23_9", "no": 9, "en": "What did you do yesterday?", "ko": "너는 어제 무엇을 했니?"}, {"id": "u23_10", "no": 10, "en": "I went to the dentist.", "ko": "나는 치과에 갔어."}, {"id": "u23_11", "no": 11, "en": "What did you do in the morning?", "ko": "너는 아침에 무엇을 했니?"}, {"id": "u23_12", "no": 12, "en": "I went to the library.", "ko": "나는 도서관에 갔어."}, {"id": "u23_13", "no": 13, "en": "Who went to the library with you?", "ko": "누가 너와 함께 도서관에 갔니?"}, {"id": "u23_14", "no": 14, "en": "I went there alone.", "ko": "나는 거기에 혼자 갔어."}, {"id": "u23_15", "no": 15, "en": "What did you make for dinner?", "ko": "너는 저녁으로 무엇을 만들었니?"}, {"id": "u23_16", "no": 16, "en": "I made pizza.", "ko": "나는 피자를 만들었어."}, {"id": "u23_17", "no": 17, "en": "Who did you make pizza with?", "ko": "너는 누구와 피자를 만들었니?"}, {"id": "u23_18", "no": 18, "en": "I made it with my mom.", "ko": "나는 엄마와 그것을 만들었어."}, {"id": "u23_19", "no": 19, "en": "What did you do before bedtime?", "ko": "너는 잠자리에 들기 전에 무엇을 했니?"}, {"id": "u23_20", "no": 20, "en": "I watched TV.", "ko": "나는 TV를 봤어."}, {"id": "u23_21", "no": 21, "en": "What did you see at the zoo?", "ko": "너는 동물원에서 무엇을 봤니?"}, {"id": "u23_22", "no": 22, "en": "Who do you play baseball with?", "ko": "너는 누구와 야구를 하니?"}, {"id": "u23_23", "no": 23, "en": "Who won the game yesterday?", "ko": "어제 누가 경기에서 이겼니?"}]}, "u24": {"title": "Unit 24", "subtitle": "when / where / why 의문문", "questions": [{"id": "u24_1", "no": 1, "en": "Where did you leave your bike?", "ko": "너는 네 자전거를 어디에 두었니?"}, {"id": "u24_2", "no": 2, "en": "I put it in the garage.", "ko": "나는 그것을 차고에 두었어."}, {"id": "u24_3", "no": 3, "en": "When does the flight arrive?", "ko": "그 비행기는 언제 도착하니?"}, {"id": "u24_4", "no": 4, "en": "It arrives at eight forty.", "ko": "그것은 8시 40분에 도착해."}, {"id": "u24_5", "no": 5, "en": "Why is he upset?", "ko": "그는 왜 속상해하니?"}, {"id": "u24_6", "no": 6, "en": "Because he lost his cap.", "ko": "그가 모자를 잃어버렸기 때문이야."}, {"id": "u24_7", "no": 7, "en": "Why didn't you come yesterday?", "ko": "너는 어제 왜 오지 않았니?"}, {"id": "u24_8", "no": 8, "en": "Because I was too busy.", "ko": "내가 너무 바빴기 때문이야."}, {"id": "u24_9", "no": 9, "en": "Where did you buy those pants?", "ko": "너는 저 바지를 어디에서 샀니?"}, {"id": "u24_10", "no": 10, "en": "In Myeongdong.", "ko": "명동에서."}, {"id": "u24_11", "no": 11, "en": "Why are you crying?", "ko": "너는 왜 울고 있니?"}, {"id": "u24_12", "no": 12, "en": "Because I lost my mom.", "ko": "엄마를 잃어버렸기 때문이야."}, {"id": "u24_13", "no": 13, "en": "Where can I find shampoo?", "ko": "샴푸는 어디에서 찾을 수 있나요?"}, {"id": "u24_14", "no": 14, "en": "It's over there at the end of the aisle.", "ko": "통로 끝 저쪽에 있습니다."}, {"id": "u24_15", "no": 15, "en": "When did the train leave?", "ko": "기차는 언제 떠났나요?"}, {"id": "u24_16", "no": 16, "en": "Just a minute ago.", "ko": "바로 1분 전에요."}, {"id": "u24_17", "no": 17, "en": "When did you meet him?", "ko": "너는 그를 언제 만났니?"}, {"id": "u24_18", "no": 18, "en": "I met him in the park.", "ko": "나는 공원에서 그를 만났어."}, {"id": "u24_19", "no": 19, "en": "When will you tell her?", "ko": "너는 그녀에게 언제 말할 거니?"}, {"id": "u24_20", "no": 20, "en": "I will tell her next week.", "ko": "나는 다음 주에 그녀에게 말할 거야."}, {"id": "u24_21", "no": 21, "en": "Why was he sad?", "ko": "그는 왜 슬펐니?"}, {"id": "u24_22", "no": 22, "en": "Because his dog was sick.", "ko": "그의 개가 아팠기 때문이야."}, {"id": "u24_23", "no": 23, "en": "When do you have lunch?", "ko": "너는 언제 점심을 먹니?"}, {"id": "u24_24", "no": 24, "en": "I have lunch at noon.", "ko": "나는 정오에 점심을 먹어."}, {"id": "u24_25", "no": 25, "en": "Where is the post office?", "ko": "우체국은 어디에 있나요?"}, {"id": "u24_26", "no": 26, "en": "It is on the corner.", "ko": "그것은 모퉁이에 있어요."}]}, "u25": {"title": "Unit 25", "subtitle": "how 의문문", "questions": [{"id": "u25_1", "no": 1, "en": "How tall is this tower?", "ko": "이 탑은 얼마나 높니?"}, {"id": "u25_2", "no": 2, "en": "It's 45 meters.", "ko": "그것은 45미터야."}, {"id": "u25_3", "no": 3, "en": "How much is a ticket?", "ko": "표 한 장은 얼마니?"}, {"id": "u25_4", "no": 4, "en": "It's 10 dollars.", "ko": "그것은 10달러야."}, {"id": "u25_5", "no": 5, "en": "How did you get there?", "ko": "너는 거기에 어떻게 갔니?"}, {"id": "u25_6", "no": 6, "en": "By bus.", "ko": "버스로."}, {"id": "u25_7", "no": 7, "en": "How many pens do you need?", "ko": "너는 펜이 몇 자루 필요하니?"}, {"id": "u25_8", "no": 8, "en": "A dozen, please.", "ko": "12자루 주세요."}, {"id": "u25_9", "no": 9, "en": "How often do you see her?", "ko": "너는 그녀를 얼마나 자주 만나니?"}, {"id": "u25_10", "no": 10, "en": "Once a week.", "ko": "일주일에 한 번."}, {"id": "u25_11", "no": 11, "en": "How many are there?", "ko": "몇 개가 있니?"}, {"id": "u25_12", "no": 12, "en": "How tall are you?", "ko": "너는 키가 얼마니?"}, {"id": "u25_13", "no": 13, "en": "How long is this?", "ko": "이것은 길이가 얼마나 되니?"}, {"id": "u25_14", "no": 14, "en": "How much is this?", "ko": "이것은 얼마니?"}, {"id": "u25_15", "no": 15, "en": "How old is your father?", "ko": "너의 아버지는 연세가 어떻게 되시니?"}, {"id": "u25_16", "no": 16, "en": "He's 50 years old.", "ko": "그는 50세야."}, {"id": "u25_17", "no": 17, "en": "How far is your school from here?", "ko": "너희 학교는 여기에서 얼마나 머니?"}, {"id": "u25_18", "no": 18, "en": "It's about ten minutes' walk.", "ko": "걸어서 약 10분 거리야."}, {"id": "u25_19", "no": 19, "en": "How often do you visit your grandparents?", "ko": "너는 조부모님을 얼마나 자주 방문하니?"}, {"id": "u25_20", "no": 20, "en": "Every Sunday.", "ko": "매주 일요일마다."} function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}function beep(f,d,t='sine',v=.08){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.setValueAtTime(f,audioCtx.currentTime);g.gain.setValueAtTime(v,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}function sfxOK(){initAudio();beep(620,.09);setTimeout(()=>beep(820,.13),85)}function sfxNG(){initAudio();beep(250,.16,'sawtooth',.10)}function okFlash(){const el=document.getElementById('okFlash');el.classList.remove('show');void el.offsetWidth;el.classList.add('show')}function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}function nowStr(){return new Date().toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}function getAllState(){try{return JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){return {}}}function setAllState(s){localStorage.setItem(STORE,JSON.stringify(s))}function getUnitState(uid){const all=getAllState(),total=UNIT_DATA[uid].questions.length;if(!all[uid])all[uid]={idx:0,done:[],wrong:[],attempts:0,pass:false,bestScore:0,lastScore:0,lastTime:'',total};all[uid].total=total;setAllState(all);return all[uid]}function saveUnitState(uid,st){const all=getAllState();all[uid]=st;setAllState(all)}function pct(n,t){return t?Math.round(n/t*100):0}function calcScore(st,total){const done=(st.done||[]).length,wrong=(st.wrong||[]).length;return pct(Math.max(0,done-wrong),total)}function showTab(id,btn){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById(id).classList.add('active');btn.classList.add('active');if(id.startsWith('u')){currentUnit=id;currentMode='main';renderUnit(id)}}function firstUnsolvedIndex(uid){const st=getUnitState(uid),qs=UNIT_DATA[uid].questions;for(let i=0;i<qs.length;i++)if(!(st.done||[]).includes(qs[i].id))return i;return qs.length}function tokenList(s){return s.split(/\s+/).filter(Boolean)}function norm(s){return s.toLowerCase().replace(/[“”‘’]/g,"'").replace(/[^a-z0-9]+/g,' ').trim()}
function renderUnit(uid){const sec=document.getElementById(uid),unit=UNIT_DATA[uid],st=getUnitState(uid),total=unit.questions.length,idx=Math.min(st.idx||firstUnsolvedIndex(uid),total);st.idx=idx;saveUnitState(uid,st);if(idx>=total){const score=calcScore(st,total),wrong=(st.wrong||[]).length;st.lastScore=score;st.bestScore=Math.max(st.bestScore||0,score);st.pass=score===100&&wrong===0;st.lastTime=nowStr();saveUnitState(uid,st);sec.innerHTML=`<div class="card soft finishBox"><div class="finishIcon">${wrong===0?'🏆':'📝'}</div><div class="title">${unit.title} 완료</div><div class="finishScore">${score}점</div><div class="sub">완료 ${(st.done||[]).length}/${total} · 남은 오답 ${wrong}개</div><div style="margin-top:10px" class="${wrong===0?'pass':'fail'}">${wrong===0?'100점 통과!':'오답을 다시 풀면 통과할 수 있습니다.'}</div>${wrong?`<button class="primary orange" onclick="startWrongForUnit('${uid}')">이 Unit 오답 다시 풀기</button>`:`<button class="secondary" onclick="restartUnit('${uid}')">처음부터 다시 연습</button>`}</div>`;return}renderQuestion(uid,unit.questions[idx],'main')}
function renderQuestion(uid,q,mode='main'){currentUnit=uid;currentQuestion=q;currentMode=mode;const unit=UNIT_DATA[uid],st=getUnitState(uid),total=unit.questions.length,done=(st.done||[]).length,score=calcScore(st,total),sec=document.getElementById(uid);sec.innerHTML=`<div class="status"><span class="badge">${unit.title} · ${q.no} / ${total}</span><span class="badge">현재 ${score}점</span></div><div class="card soft"><div class="title">${unit.subtitle}</div><div class="progress"><div class="bar" style="width:${pct(done,total)}%"></div></div><div class="sub">자료 순서대로 진행됩니다. 모든 단어를 올리면 자동으로 채점됩니다.</div></div><div class="koBox">${q.ko}</div><div class="tip">단어를 드래그하거나 터치해서 위 답안 영역으로 옮기세요.</div><div id="answerArea" class="answerArea"></div><div id="wordBank" class="wordBank"></div><div id="resultNote" class="resultNote"></div><button id="nextBtn" class="primary nextBtn" onclick="goNext()">다음 문제</button>`;const bank=document.getElementById('wordBank');shuffle(tokenList(q.en)).forEach((w,i)=>{const c=document.createElement('button');c.type='button';c.className='chip';c.textContent=w;c.onclick=()=>moveChip(c);bank.appendChild(c)});setupSortable()}
function setupSortable(){if(window._sortAnswer){try{window._sortAnswer.destroy();window._sortBank.destroy()}catch(e){}}const answer=document.getElementById('answerArea'),bank=document.getElementById('wordBank');if(!answer||!bank)return;const opts={group:'dictWords',animation:170,ghostClass:'sortable-ghost',dragClass:'sortable-drag',forceFallback:true,fallbackOnBody:true,fallbackTolerance:4,swapThreshold:.65,onStart:()=>{window._isDragging=true},onEnd:()=>{setTimeout(()=>{window._isDragging=false;checkIfReady()},80)}};if(window.Sortable){window._sortAnswer=Sortable.create(answer,opts);window._sortBank=Sortable.create(bank,opts)}}function moveChip(chip){if(window._isDragging)return;const answer=document.getElementById('answerArea'),bank=document.getElementById('wordBank');if(chip.parentElement===bank)answer.appendChild(chip);else bank.appendChild(chip);checkIfReady()}function checkIfReady(){const bank=document.getElementById('wordBank');if(bank&&bank.children.length===0)checkAnswer()}function checkAnswer(){const answer=document.getElementById('answerArea'),note=document.getElementById('resultNote'),nextBtn=document.getElementById('nextBtn');const ans=Array.from(answer.children).map(x=>x.textContent).join(' '),ok=norm(ans)===norm(currentQuestion.en);if(ok){answer.style.background='#e8fff4';answer.style.borderColor='var(--green)';note.className='resultNote good';note.textContent='맞았어요! OK 확인 후 다음 문제를 누르세요.';nextBtn.classList.add('show');sfxOK();okFlash();lockCurrentChips(true);markCorrect()}else{answer.style.background='#fff0f0';answer.style.borderColor='var(--red)';note.className='resultNote bad';note.textContent='아직 순서가 달라요. 단어를 드래그해서 다시 고쳐 보세요.';sfxNG();markWrong();setTimeout(()=>{answer.style.background='#eef7ff';answer.style.borderColor='var(--main)';note.className='resultNote'},900)}}function lockCurrentChips(lock){document.querySelectorAll('.chip').forEach(c=>{c.disabled=lock;c.style.cursor=lock?'default':'grab'});if(lock&&window._sortAnswer){try{window._sortAnswer.option('disabled',true);window._sortBank.option('disabled',true)}catch(e){}}}
function markCorrect(){if(currentMode==='review'){removeWrong(currentQuestion.id);return}const st=getUnitState(currentUnit),total=UNIT_DATA[currentUnit].questions.length;if(!(st.done||[]).includes(currentQuestion.id))st.done.push(currentQuestion.id);const idx=UNIT_DATA[currentUnit].questions.findIndex(x=>x.id===currentQuestion.id);st.idx=Math.min(idx+1,total);st.lastScore=calcScore(st,total);st.bestScore=Math.max(st.bestScore||0,st.lastScore);st.pass=st.lastScore===100&&(st.wrong||[]).length===0&&st.done.length===total;st.lastTime=nowStr();saveUnitState(currentUnit,st)}function markWrong(){const st=getUnitState(currentUnit);if(!(st.wrong||[]).includes(currentQuestion.id))st.wrong.push(currentQuestion.id);st.lastTime=nowStr();saveUnitState(currentUnit,st)}function removeWrong(qid){const uid=qid.split('_')[0],st=getUnitState(uid),total=UNIT_DATA[uid].questions.length;st.wrong=(st.wrong||[]).filter(id=>id!==qid);if(!(st.done||[]).includes(qid))st.done.push(qid);st.lastScore=calcScore(st,total);st.bestScore=Math.max(st.bestScore||0,st.lastScore);st.pass=st.lastScore===100&&st.wrong.length===0&&st.done.length===total;st.lastTime=nowStr();saveUnitState(uid,st)}function goNext(){if(currentMode==='review'){reviewPos++;if(reviewPos<reviewQueue.length){const item=reviewQueue[reviewPos];renderReviewQuestion(item.uid,findQuestionById(item.id))}else{renderWrong();document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById('wrong').classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.nav button')[4].classList.add('active')}return}renderUnit(currentUnit)}function findQuestionById(id){const uid=id.split('_')[0];return UNIT_DATA[uid].questions.find(q=>q.id===id)}function restartUnit(uid){if(!confirm('이 Unit을 처음부터 다시 연습할까요? 기존 최고 기록은 유지됩니다.'))return;const old=getUnitState(uid);saveUnitState(uid,{idx:0,done:[],wrong:[],attempts:(old.attempts||0)+1,pass:false,bestScore:old.bestScore||0,lastScore:0,lastTime:nowStr(),total:UNIT_DATA[uid].questions.length});renderUnit(uid)}function renderHistory(){const box=document.getElementById('histList');box.innerHTML='';['u23','u24','u25'].forEach(uid=>{const unit=UNIT_DATA[uid],st=getUnitState(uid),total=unit.questions.length,done=(st.done||[]).length,wrong=(st.wrong||[]).length,score=calcScore(st,total),next=Math.min(st.idx||firstUnsolvedIndex(uid),total);box.insertAdjacentHTML('beforeend',`<div class="hist-row"><div><b>${unit.title}</b><br><span class="sub">진행 ${done}/${total} · 오답 ${wrong}개 · 최근 ${st.lastTime||'기록 없음'}</span><br><span class="${score===100&&wrong===0?'pass':'fail'}">현재 ${score}점 / 최고 ${st.bestScore||0}점 ${score===100&&wrong===0?'· 통과':''}</span></div><button class="smallBtn" onclick="jumpUnit('${uid}')">${next>=total?'결과':'이어풀기'}</button></div>`)})}function jumpUnit(uid){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById(uid).classList.add('active');document.querySelectorAll('.nav button')[{u23:0,u24:1,u25:2}[uid]].classList.add('active');currentMode='main';currentUnit=uid;renderUnit(uid)}function allWrongItems(){let arr=[];['u23','u24','u25'].forEach(uid=>{const st=getUnitState(uid);(st.wrong||[]).forEach(id=>arr.push({uid,id}))});return arr}function renderWrong(){const box=document.getElementById('wrongList');box.innerHTML='';const arr=allWrongItems();if(!arr.length){box.innerHTML='<div class="card soft"><div class="title">남은 오답이 없습니다.</div><div class="sub">모든 오답을 해결했습니다.</div></div>';return}box.insertAdjacentHTML('beforeend','<button class="primary orange" onclick="startWrongAll()">오답 전체 다시 풀기</button>');arr.forEach(item=>{const q=findQuestionById(item.id),unit=UNIT_DATA[item.uid];box.insertAdjacentHTML('beforeend',`<div class="wrong-item"><div><b>${unit.title} - ${q.no}번</b><br><span class="sub">${q.ko}</span></div><button class="smallBtn" onclick="startSingleWrong('${item.uid}','${item.id}')">풀기</button></div>`)})}function startWrongAll(){reviewQueue=allWrongItems();reviewPos=0;if(!reviewQueue.length)return renderWrong();const item=reviewQueue[0];renderReviewQuestion(item.uid,findQuestionById(item.id))}function startWrongForUnit(uid){const st=getUnitState(uid);reviewQueue=(st.wrong||[]).map(id=>({uid,id}));reviewPos=0;if(!reviewQueue.length)return renderUnit(uid);renderReviewQuestion(uid,findQuestionById(reviewQueue[0].id))}function startSingleWrong(uid,id){reviewQueue=[{uid,id}];reviewPos=0;renderReviewQuestion(uid,findQuestionById(id))}function renderReviewQuestion(uid,q){currentMode='review';document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById(uid).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.nav button')[{u23:0,u24:1,u25:2}[uid]].classList.add('active');renderQuestion(uid,q,'review');const note=document.querySelector('#'+uid+' .tip');if(note)note.textContent='오답 다시 풀기입니다. 맞히면 오답 목록에서 사라집니다.'}
renderUnit('u23');
</script></body></html>
