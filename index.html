let selectedEnglishVoice=null;
function loadEnglishVoice(){if(!('speechSynthesis'in window))return;const voices=speechSynthesis.getVoices();selectedEnglishVoice=voices.find(v=>(v.lang==='en-US'||v.lang==='en_US')&&/samantha|alex|ava|allison|nicky|english/i.test(v.name))||voices.find(v=>v.lang==='en-US'||v.lang==='en_US')||null}
if('speechSynthesis'in window){loadEnglishVoice();speechSynthesis.onvoiceschanged=loadEnglishVoice}
function speak(text,rate=.78,onend=null){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();loadEnglishVoice();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;u.pitch=1;u.volume=1;if(selectedEnglishVoice)u.voice=selectedEnglishVoice;if(onend)u.onend=onend;speechSynthesis.speak(u)}

let audioCtx=null,comboCount=0;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}
function tone(f,t,d,v=.08){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.setValueAtTime(f,audioCtx.currentTime);g.gain.setValueAtTime(v,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}
function sfxOK(){tone(600,'sine',.1);setTimeout(()=>tone(800,'sine',.15),100)}function sfxNG(){tone(280,'sawtooth',.2,.12)}function sfxEvo(){[420,560,720].forEach((f,i)=>setTimeout(()=>tone(f,'square',.18,.05),i*120))}function boom(){sfxEvo();if(window.confetti)confetti({particleCount:120,spread:70,origin:{y:.6}})}
function shuffle(a){let arr=[...a];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function todayKey(){const t=new Date();return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`}
function saveHist(key,data){let arr=JSON.parse(localStorage.getItem(STORE+'_'+key)||'[]');data.date=new Date().toLocaleString('ko-KR');arr.unshift(data);localStorage.setItem(STORE+'_'+key,JSON.stringify(arr.slice(0,20)))}
function saveWrong(w){let arr=JSON.parse(localStorage.getItem(STORE+'_wrong')||'[]');if(!arr.find(x=>x.en===w.en)){arr.push(w);localStorage.setItem(STORE+'_wrong',JSON.stringify(arr))}}
function showCombo(ok){if(ok)comboCount++;else{comboCount=0;return}if(comboCount<2)return;const el=document.getElementById('combo');el.textContent=`${comboCount} COMBO!`;el.classList.remove('combo-pop');void el.offsetWidth;el.classList.add('combo-pop')}
function updateEvo(pre,cur,tot){const r=tot?cur/tot:0;const s=[[0,'🥚','수상한 알'],[.12,'🐣','부화한 새'],[.25,'🦎','빠른 도마뱀'],[.4,'🦖','공룡 에너지'],[.55,'🐲','하늘 용'],[.7,'🕊️','흰 비둘기'],[.82,'🦅','독수리 집중력'],[.94,'🐦‍⬛','검은 새 변신'],[1,'🐦','거대 비둘기 진화!']];let st=s[0];for(const x of s)if(r>=x[0])st=x;const pct=Math.floor(r*100);const em=document.getElementById(pre+'e');if(em){em.textContent=st[1];em.style.transform='scale(1.25)';setTimeout(()=>em.style.transform='scale(1)',250);document.getElementById(pre+'n').textContent=`${st[2]} (${pct}%)`;document.getElementById(pre+'b').style.width=pct+'%'}}

function showSec(id,btn){stopLoop();comboCount=0;document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));document.getElementById(id).classList.add('active');btn.classList.add('active');if(id==='dict-sec'){initAudio();if(!dictLoaded){loadDict();dictLoaded=true}else{isLoop=true;loopPlay()}updatePlayBtn()}}

// Word
let wList=[],wIdx=0,wOK=0,wBusy=false;
function startWord(){wList=shuffle(wordList);wIdx=0;wOK=0;comboCount=0;document.getElementById('word-intro').style.display='none';document.getElementById('word-result').style.display='none';document.getElementById('word-quiz').style.display='block';loadWord()}
function loadWord(){wBusy=false;updateEvo('wevo-',wIdx,wList.length);const q=wList[wIdx];document.getElementById('w-status').textContent=`문제 ${wIdx+1} / ${wList.length}`;document.getElementById('w-en').textContent=q.en;speak(q.en,.78);const opts=shuffle([{t:q.ko,ok:true},...shuffle(wordList.filter(w=>w.ko!==q.ko)).slice(0,3).map(w=>({t:w.ko,ok:false}))]);const div=document.getElementById('w-opts');div.innerHTML='';opts.forEach((o,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=`${i+1}. ${o.t}`;b.onclick=()=>handleWord(b,o.ok,div,q);div.appendChild(b)})}
function handleWord(btn,ok,div,q){if(wBusy)return;wBusy=true;showCombo(ok);if(ok){sfxOK();btn.classList.add('correct');wOK++}else{sfxNG();btn.classList.add('wrong');saveWrong(q);[...div.children].forEach(b=>{if(b.textContent.includes(q.ko))b.classList.add('correct')})}setTimeout(()=>{wIdx++;wIdx<wList.length?loadWord():finishWord()},750)}
function finishWord(early=false){const tot=early?wIdx:wList.length;if(tot===0){resetWord();return}const sc=Math.round(wOK/tot*100);saveHist('word',{score:sc,correct:wOK,total:tot});document.getElementById('word-quiz').style.display='none';document.getElementById('word-result').style.display='block';document.getElementById('w-res-e').textContent=sc>=90?'🐦':'🐣';document.getElementById('w-score').textContent=sc+'점';document.getElementById('w-detail').textContent=`정답 ${wOK}/${tot}`;if(sc>=90)boom()}
function resetWord(){document.getElementById('word-result').style.display='none';document.getElementById('word-intro').style.display='block'}

// Dictation
let dIdx=0,isLoop=false,loopTimer=null,dictLoaded=false,spIdx=0;const speeds=[.78,.62,.5],sLabels=['🇺🇸 보통','🐢 느리게','🐌 아주 느리게'];
function cleanWords(s){return s.replace(/[“”"‘’.,!?;:()]/g,'').split(/\s+/).filter(Boolean)}
function norm(s){return s.toLowerCase().replace(/[^a-z0-9]/g,'')}
function loopPlay(){if(!isLoop||!sentenceList.length)return;speak(sentenceList[dIdx].en,speeds[spIdx],()=>{if(isLoop)loopTimer=setTimeout(loopPlay,900)})}
function stopLoop(){isLoop=false;if('speechSynthesis'in window)speechSynthesis.cancel();clearTimeout(loopTimer)}
function toggleAudio(){if(isLoop)stopLoop();else{isLoop=true;loopPlay()}updatePlayBtn()}
function updatePlayBtn(){const b=document.getElementById('play-btn');if(!b)return;b.textContent=isLoop?'⏸️ 멈춤':'▶️ 음성 반복';b.className='play'+(isLoop?' on':'')}
function toggleSpeed(){spIdx=(spIdx+1)%speeds.length;document.getElementById('speed-btn').textContent=sLabels[spIdx];if(isLoop){stopLoop();isLoop=true;loopPlay()}}
function loadDict(){stopLoop();updateEvo('devo-',dIdx,sentenceList.length);const s=sentenceList[dIdx];document.getElementById('d-status').textContent=`영작 ${dIdx+1} / ${sentenceList.length}`;document.getElementById('d-ko').textContent=s.ko;const aa=document.getElementById('answer-area'),sa=document.getElementById('scramble-area');aa.innerHTML='';sa.innerHTML='';aa.style.background='var(--light)';aa.style.borderColor='var(--main)';shuffle(cleanWords(s.en)).forEach(w=>{const b=document.createElement('button');b.className='chip';b.textContent=w;b.onclick=function(){(this.parentElement.id==='scramble-area'?aa:sa).appendChild(this);if(sa.children.length===0)checkDict()};sa.appendChild(b)});if(!window._sortable){window._sortable=new Sortable(aa,{animation:250,ghostClass:'sortable-ghost',onEnd:()=>{if(sa.children.length===0)checkDict()}})}isLoop=true;loopPlay();updatePlayBtn()}
function checkDict(){const student=[...document.getElementById('answer-area').children].map(b=>b.textContent).join(' ');if(norm(student)===norm(sentenceList[dIdx].en)){sfxOK();showCombo(true);document.getElementById('answer-area').style.background='#d4edda';recDict();stopLoop();updatePlayBtn();setTimeout(nextDict,650)}else{sfxNG();showCombo(false);const aa=document.getElementById('answer-area');aa.style.background='#fde8e8';setTimeout(()=>aa.style.background='var(--light)',400)}}
function nextDict(){if(dIdx+1<sentenceList.length){dIdx++;loadDict()}else{updateEvo('devo-',sentenceList.length,sentenceList.length);boom();alert('영작 완료!')}}
function recDict(){let h=JSON.parse(localStorage.getItem(STORE+'_dict')||'{}');h.last=dIdx+1;h.total=sentenceList.length;h.time=new Date().toLocaleString('ko-KR');h[todayKey()]=(h[todayKey()]||0)+1;localStorage.setItem(STORE+'_dict',JSON.stringify(h))}
function jumpPrompt(){const n=parseInt(prompt(`이동할 문장 번호를 입력하세요. (1~${sentenceList.length})`,dIdx+1));if(n>=1&&n<=sentenceList.length){dIdx=n-1;loadDict()}}

// Analysis
let aIdx=0,aStage=1,aActive=0,aAns=[];
function startAnal(){aIdx=0;comboCount=0;document.getElementById('anal-intro').style.display='none';document.getElementById('anal-result').style.display='none';document.getElementById('anal-quiz').style.display='block';loadAnal()}
function loadAnal(){updateEvo('aevo-',aIdx,analysisList.length);aStage=1;aActive=0;const d=analysisList[aIdx];aAns=new Array(d[1].length).fill(null);document.getElementById('a-count').textContent=`${aIdx+1} / ${analysisList.length}`;document.getElementById('a-ko').textContent=d[0];document.getElementById('a-stage').textContent='1단계: 품사';document.getElementById('a-info').classList.remove('show');document.getElementById('a-result-box').innerHTML='';buildChunks();buildChoices()}
function buildChunks(){const wrap=document.getElementById('a-chunks');wrap.innerHTML='';analysisList[aIdx][1].forEach((c,i)=>{const d=document.createElement('div');d.className='chunk'+(i===aActive?' active':'');d.innerHTML=`<div class="chunk-en">${c[0]}</div><div class="chunk-ans" id="ca${i}">?</div>`;d.onclick=()=>{if(!d.classList.contains('done')&&!d.classList.contains('done2')){aActive=i;highlight()}};wrap.appendChild(d)})}
function highlight(){document.querySelectorAll('.chunk').forEach((c,i)=>c.classList.toggle('active',i===aActive&&!c.classList.contains('done')&&!c.classList.contains('done2')))}
function buildChoices(){const grid=document.getElementById('a-choices');grid.style.display='flex';grid.innerHTML='';(aStage===1?posList:roleList).forEach(x=>{const b=document.createElement('button');b.className='choice';b.textContent=x;b.onclick=()=>pick(x);grid.appendChild(b)})}
function pick(val){const c=analysisList[aIdx][1][aActive];const correct=aStage===1?c[1]:c[2];const card=document.querySelectorAll('.chunk')[aActive];if(val===correct){sfxOK();showCombo(true);aAns[aActive]=val;document.getElementById('ca'+aActive).textContent=val;card.classList.remove('active');card.classList.add(aStage===1?'done':'done2');const n=aAns.indexOf(null);if(n!==-1){aActive=n;highlight()}else{if(aStage===1){let html='';analysisList[aIdx][1].forEach(x=>{if(x[3])html+=`<div class="detail"><b>${x[0]}</b><br>${x[3].replace(/\\n/g,'<br>')}</div>`});if(!html)html='<div class="detail">기본 구조 문장입니다.</div>';document.getElementById('a-info-desc').innerHTML=html;document.getElementById('a-choices').style.display='none';document.getElementById('a-info').classList.add('show')}else{recAnal();document.getElementById('a-choices').style.display='none';document.getElementById('a-result-box').innerHTML='<div class="card" style="text-align:center"><b>분석 성공!</b><button class="primary" onclick="nextAnal()">다음 문장</button></div>'}}}else{sfxNG();showCombo(false);card.style.borderColor='var(--red)';setTimeout(()=>card.style.borderColor='#cfe4f8',400)}}
function startStep2(){aStage=2;aAns.fill(null);aActive=0;document.getElementById('a-stage').textContent='2단계: 문장성분';document.getElementById('a-info').classList.remove('show');document.querySelectorAll('.chunk').forEach((c,i)=>{c.classList.remove('done','done2','active');if(i===0)c.classList.add('active');document.getElementById('ca'+i).textContent='?'});buildChoices()}
function nextAnal(){aIdx++;if(aIdx<analysisList.length)loadAnal();else{saveHist('anal',{count:analysisList.length,total:analysisList.length});document.getElementById('anal-quiz').style.display='none';document.getElementById('anal-result').style.display='block';boom()}}
function recAnal(){let h=JSON.parse(localStorage.getItem(STORE+'_anal')||'{}');h.last=aIdx+1;h.total=analysisList.length;h.time=new Date().toLocaleString('ko-KR');localStorage.setItem(STORE+'_anal',JSON.stringify(h))}
function finishAnal(){document.getElementById('anal-quiz').style.display='none';document.getElementById('anal-result').style.display='block'}function resetAnal(){document.getElementById('anal-result').style.display='none';document.getElementById('anal-intro').style.display='block'}

// History/Review
function renderHistory(){const div=document.getElementById('hist-list');div.innerHTML='';const wh=JSON.parse(localStorage.getItem(STORE+'_word')||'[]');div.innerHTML+='<div class="hist-category">단어 기록</div>';div.innerHTML+=wh.length?wh.slice(0,3).map(r=>`<div class="hist-card"><div class="hist-date">${r.date}</div><div class="hist-score">${r.score}점 (${r.correct}/${r.total})</div></div>`).join(''):'<p>기록 없음</p>';const dh=JSON.parse(localStorage.getItem(STORE+'_dict')||'{}');div.innerHTML+='<div class="hist-category">영작 기록</div>';div.innerHTML+=dh.last?`<div class="hist-card"><div class="hist-date">${dh.time||''}</div><div class="hist-score">${dh.last}번 / ${dh.total}번까지 완료</div></div>`:'<p>기록 없음</p>';const ah=JSON.parse(localStorage.getItem(STORE+'_anal')||'{}');div.innerHTML+='<div class="hist-category">분석 기록</div>';div.innerHTML+=ah.last?`<div class="hist-card"><div class="hist-date">${ah.time||''}</div><div class="hist-score">${ah.last}번 / ${ah.total}번까지 완료</div></div>`:'<p>기록 없음</p>'}
function renderReview(){const div=document.getElementById('rev-list');const arr=JSON.parse(localStorage.getItem(STORE+'_wrong')||'[]');if(!arr.length){div.innerHTML='<div class="card" style="text-align:center;color:var(--green);font-weight:900">오답이 없습니다!</div>';return}div.innerHTML=arr.map((w,i)=>`<div class="wrong-item"><div><div class="wrong-en">${w.en}</div><div class="wrong-ko">${w.ko}</div></div><button class="del" onclick="delWrong(${i})">삭제</button></div>`).join('')}
function delWrong(i){let arr=JSON.parse(localStorage.getItem(STORE+'_wrong')||'[]');arr.splice(i,1);localStorage.setItem(STORE+'_wrong',JSON.stringify(arr));renderReview()}function clearWrong(){if(confirm('오답을 모두 지울까요?')){localStorage.removeItem(STORE+'_wrong');renderReview()}}
</script>
</body>
