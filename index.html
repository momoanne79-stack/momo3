const posList=['명사(구/절)','대명사','형용사(구/절)','부사(구/절)','동사(구)']; const roleList=['주어','서술어','목적어','보어','수식어'];
let selectedEnglishVoice=null;function loadEnglishVoice(){if(!('speechSynthesis'in window))return;const voices=window.speechSynthesis.getVoices();selectedEnglishVoice=voices.find(v=>(v.lang==='en-US'||v.lang==='en_US')&&/samantha|alex|ava|allison|nicky/i.test(v.name))||voices.find(v=>v.lang==='en-US'||v.lang==='en_US')||null}if('speechSynthesis'in window){loadEnglishVoice();window.speechSynthesis.onvoiceschanged=loadEnglishVoice}function speak(text,rate=.78,onend=null){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();loadEnglishVoice();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;u.pitch=1;u.volume=1;if(selectedEnglishVoice)u.voice=selectedEnglishVoice;if(onend)u.onend=onend;window.speechSynthesis.speak(u)}
let audioCtx=null,comboCount=0;function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}function tone(f,t,d,v=.08){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.setValueAtTime(f,audioCtx.currentTime);g.gain.setValueAtTime(v,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}function sfxOK(){tone(600,'sine',.1);setTimeout(()=>tone(800,'sine',.15),100)}function sfxNG(){tone(280,'sawtooth',.18,.12)}function sfxEvo(){[400,520,680].forEach((f,i)=>setTimeout(()=>tone(f,'square',.16,.05),i*120))}function boom(){sfxEvo();if(window.confetti)confetti({particleCount:130,spread:75,origin:{y:.62},colors:['#1a5c9a','#f5a623','#27ae60']})}
function shuffle(a){let arr=[...a];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}function todayKey(){const t=new Date();return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`}function fmtKey(k){return k.replace(/-/g,'. ')}function safeGet(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}}function safeSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function showCombo(ok){if(ok)comboCount++;else{comboCount=0;return}if(comboCount<2)return;const el=document.getElementById('combo');el.innerText=`${comboCount} COMBO! ✨`;el.classList.remove('combo-pop');void el.offsetWidth;el.classList.add('combo-pop')}function updateEvo(pre,cur,tot){const r=tot?cur/tot:0;const s=[[0,'🥚','수상한 알'],[.001,'🐣','부화한 비둘기'],[.18,'🦎','도마뱀 훈련생'],[.35,'🦖','공룡 비둘기 후보'],[.55,'🐲','하늘 준비 완료'],[.72,'🕊️','평화 비둘기'],[.86,'🦅','독수리급 집중력'],[.96,'🐦‍⬛','검은 비둘기 각성'],[1,'🐦','거대 비둘기 진화']];let st=s[0];for(const x of s)if(r>=x[0])st=x;const pct=Math.floor(r*100);const em=document.getElementById(pre+'e');em.innerText=st[1];em.style.transform='scale(1.25)';setTimeout(()=>em.style.transform='scale(1)',260);document.getElementById(pre+'n').innerText=`${st[2]} (${pct}%)`;document.getElementById(pre+'b').style.width=pct+'%'}
function showSection(id,btn){stopLoop();comboCount=0;document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));document.getElementById(id).classList.add('active');btn.classList.add('active');if(id==='dict-sec'){initAudio();if(!dictLoaded){loadDict();dictLoaded=true}else{isLoop=true;loopPlay()}updatePlayBtn()}}
function saveHist(key,data){const arr=safeGet(`${STORE}_${key}`,[]);data.date=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'});data.time=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});arr.unshift(data);safeSet(`${STORE}_${key}`,arr.slice(0,20))}function saveWrong(w){const arr=safeGet(`${STORE}_wrong`,[]);if(!arr.find(x=>x.en===w.en)){arr.push(w);safeSet(`${STORE}_wrong`,arr)}}
let wList=[],wIdx=0,wOK=0,wBusy=false;function startWord(){wList=shuffle(wordList);wIdx=0;wOK=0;comboCount=0;document.getElementById('word-intro').style.display='none';document.getElementById('word-result').style.display='none';document.getElementById('word-quiz').style.display='block';loadWord()}function loadWord(){wBusy=false;updateEvo('wevo-',wIdx,wList.length);const q=wList[wIdx];document.getElementById('w-status').innerText=`문제 ${wIdx+1} / ${wList.length}`;document.getElementById('w-en').innerText=q.en;speak(q.en,.78);const opts=shuffle([{t:q.ko,ok:true},...shuffle(wordList.filter(w=>w.ko!==q.ko)).slice(0,3).map(w=>({t:w.ko,ok:false}))]);const div=document.getElementById('w-opts');div.innerHTML='';opts.forEach((o,i)=>{const b=document.createElement('button');b.className='opt-btn';b.innerText=`${i+1}. ${o.t}`;b.onclick=()=>handleWord(b,o.ok,div,q);div.appendChild(b)})}function handleWord(btn,ok,div,q){if(wBusy)return;wBusy=true;showCombo(ok);if(ok){sfxOK();btn.classList.add('correct');wOK++}else{sfxNG();btn.classList.add('wrong');saveWrong(q);for(const b of div.querySelectorAll('.opt-btn'))if(b.innerText.includes(q.ko)){b.classList.add('correct');break}}setTimeout(()=>{wIdx++;wIdx<wList.length?loadWord():finishWord()},800)}function finishWord(early=false){const tot=early?wIdx:wList.length;if(!tot){resetWord();return}const sc=Math.round(wOK/tot*100);updateEvo('wevo-',wIdx,wList.length);document.getElementById('word-quiz').style.display='none';document.getElementById('word-result').style.display='block';document.getElementById('w-res-e').innerText=sc>=90?'🐦':sc>=70?'🦅':'🐣';document.getElementById('w-score').innerText=sc+'점';document.getElementById('w-detail').innerText=`정답: ${wOK}개 / ${tot}문항`;saveHist('word',{score:sc,correct:wOK,total:tot});if(!early&&sc>=90)boom()}function resetWord(){document.getElementById('word-result').style.display='none';document.getElementById('word-intro').style.display='block'}
let dIdx=0,isLoop=false,loopTimer=null,dictLoaded=false;const speeds=[.78,.62,.5],sLabels=['미국식 보통','느리게','아주 느리게'];let spIdx=0;function loopPlay(){if(!isLoop||!sentenceList.length)return;speak(sentenceList[dIdx].en,speeds[spIdx],()=>{if(isLoop)loopTimer=setTimeout(loopPlay,900)})}function stopLoop(){isLoop=false;if('speechSynthesis'in window)window.speechSynthesis.cancel();clearTimeout(loopTimer)}function toggleAudio(){if(isLoop)stopLoop();else{isLoop=true;loopPlay()}updatePlayBtn()}function updatePlayBtn(){const b=document.getElementById('play-btn');if(!b)return;b.innerText=isLoop?'음성 멈춤':'음성 재생';b.className='audio-btn play-btn'+(isLoop?' playing':'')}function toggleSpeed(){spIdx=(spIdx+1)%speeds.length;document.getElementById('speed-btn').innerText=sLabels[spIdx];if(isLoop){stopLoop();isLoop=true;loopPlay()}}function cleanWords(s){return s.replace(/[“”".,!?;:()]/g,'').split(/\s+/).filter(Boolean)}function norm(s){return s.toLowerCase().replace(/[^a-z0-9]/g,'')}function loadDict(){if(!sentenceList.length)return;stopLoop();updateEvo('devo-',dIdx,sentenceList.length);const s=sentenceList[dIdx];document.getElementById('jumpNum').max=sentenceList.length;document.getElementById('d-status').innerText=`영작 문제 ${dIdx+1} / ${sentenceList.length}`;document.getElementById('d-ko').innerText=s.ko;const aa=document.getElementById('answer-area'),sa=document.getElementById('scramble-area');aa.innerHTML='';sa.innerHTML='';aa.style.background='var(--light)';aa.style.borderColor='var(--main)';shuffle(cleanWords(s.en)).forEach(w=>{const b=document.createElement('button');b.className='word-chip';b.innerText=w;b.onclick=function(){if(this.parentElement.id==='scramble-area')aa.appendChild(this);else sa.appendChild(this);if(sa.children.length===0)checkDict()};sa.appendChild(b)});if(!window._ds){window._ds=new Sortable(aa,{animation:250,ghostClass:'sortable-ghost',dragClass:'sortable-drag',onEnd:()=>{if(document.getElementById('scramble-area').children.length===0)checkDict()}})}isLoop=true;loopPlay();updatePlayBtn()}function checkDict(){const aa=document.getElementById('answer-area');const student=Array.from(aa.children).map(b=>b.innerText).join(' ');if(norm(student)===norm(sentenceList[dIdx].en)){sfxOK();showCombo(true);aa.style.background='#d4edda';aa.style.borderColor='var(--green)';recDict();stopLoop();updatePlayBtn();setTimeout(nextDict,650)}else{sfxNG();showCombo(false);aa.style.background='#fde8e8';setTimeout(()=>aa.style.background='var(--light)',420)}}function nextDict(){if(dIdx+1<sentenceList.length){dIdx++;loadDict()}else{updateEvo('devo-',sentenceList.length,sentenceList.length);boom();alert('영작 완료!')}}function jumpTo(){const n=parseInt(document.getElementById('jumpNum').value);if(n>=1&&n<=sentenceList.length){dIdx=n-1;comboCount=0;loadDict()}else alert(`1~${sentenceList.length} 사이 번호를 입력하세요.`)}function recDict(){const dk=todayKey();const h=safeGet(`${STORE}_dict`,{});if(!h[dk])h[dk]={count:0,last:0};h[dk].count++;h[dk].last=dIdx+1;h[dk].time=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});safeSet(`${STORE}_dict`,h)}
let aIdx=0,aStage=1,aActive=0,aAns=[];function startAnal(){aIdx=0;aStage=1;comboCount=0;document.getElementById('anal-intro').style.display='none';document.getElementById('anal-result').style.display='none';document.getElementById('anal-quiz').style.display='block';loadAnal()}function loadAnal(){updateEvo('aevo-',aIdx,analysisList.length);aStage=1;aActive=0;const d=analysisList[aIdx];aAns=new Array(d[1].length).fill(null);document.getElementById('a-count').innerText=`${aIdx+1} / ${analysisList.length}`;document.getElementById('a-ko').innerText=d[0];document.getElementById('a-result-box').innerHTML='';document.getElementById('a-info').classList.remove('show');document.getElementById('a-choices').style.display='flex';const sb=document.getElementById('a-stage');sb.innerText='1단계: 품사(구/절) 찾기';sb.className='stage-badge stage1';buildChunks();buildChoices()}function buildChunks(){const d=analysisList[aIdx],wrap=document.getElementById('a-chunks');wrap.innerHTML='';d[1].forEach((c,i)=>{const div=document.createElement('div');div.className='chunk-card'+(i===aActive?' active':'');div.innerHTML=`<div class="chunk-en">${c[0]}</div><div class="chunk-ans" id="ca${i}">?</div>`;div.onclick=()=>{aActive=i;highlightChunk()};wrap.appendChild(div)})}function highlightChunk(){document.querySelectorAll('.chunk-card').forEach((c,i)=>{const done=c.classList.contains('done')||c.classList.contains('done2');c.classList.toggle('active',i===aActive&&!done)})}function buildChoices(){const grid=document.getElementById('a-choices');grid.innerHTML='';(aStage===1?posList:roleList).forEach(item=>{const b=document.createElement('button');b.className='choice-btn';b.innerText=item;b.onclick=()=>pick(item);grid.appendChild(b)})}function pick(val){
  const d=analysisList[aIdx], chunk=d[1][aActive];
  const correct=aStage===1?chunk[1]:chunk[2];
  const card=document.querySelectorAll('.chunk-card')[aActive];
  if(val!==correct){
    sfxNG(); showCombo(false);
    card.style.borderColor='var(--red)';
    setTimeout(()=>card.style.borderColor=card.classList.contains('active')?'var(--main)':'var(--line)',500);
    return;
  }
  sfxOK(); showCombo(true); aAns[aActive]=val;
  const el=document.getElementById('ca'+aActive);
  el.innerText=val; el.style.color=aStage===1?'var(--green)':'var(--main)';
  card.classList.remove('active'); card.classList.add(aStage===1?'done':'done2');
  const next=aAns.indexOf(null);
  if(next!==-1){ aActive=next; highlightChunk(); return; }
  if(aStage===1){
    let html='';
    d[1].forEach(c=>{ if(c[3]) html+=`<div class="detail-row"><b>${c[0]}</b><br>${c[3].replace(/\n/g,'<br>')}</div>`; });
    if(!html) html='<div class="detail-row">기본 구조 중심의 문장입니다.</div>';
    document.getElementById('a-info-desc').innerHTML=html;
    document.getElementById('a-choices').style.display='none';
    document.getElementById('a-info').classList.add('show');
  } else {
    recAnal();
    document.getElementById('a-choices').style.display='none';
    document.getElementById('a-result-box').innerHTML=`<div class="pattern-box"><div style="font-weight:900;color:var(--main);margin-bottom:8px">분석 완료!</div><div class="pattern-val">${patternOf(d[1])}</div><button class="primary-btn" onclick="nextAnal()">다음 문장</button></div>`;
  }
}
function patternOf(chunks){const roles=chunks.map(c=>c[2]);if(roles.includes('목적어')&&roles.includes('보어'))return '5형식 (S+V+O+O.C)';if(roles.filter(r=>r==='목적어').length>=2)return '4형식 (S+V+I.O+D.O)';if(roles.includes('목적어'))return '3형식 (S+V+O)';if(roles.includes('보어'))return '2형식 (S+V+C)';return '1형식 (S+V)'}function startStep2(){aStage=2;aAns.fill(null);aActive=0;document.getElementById('a-info').classList.remove('show');document.querySelectorAll('.chunk-card').forEach((c,i)=>{c.classList.remove('done','done2','active');if(i===0)c.classList.add('active');const el=document.getElementById('ca'+i);if(el){el.innerText='?';el.style.color='#a0aec0'}});document.getElementById('a-choices').style.display='flex';const sb=document.getElementById('a-stage');sb.innerText='2단계: 문장 성분 맞히기';sb.className='stage-badge stage2';buildChoices()}function nextAnal(){aIdx++;if(aIdx<analysisList.length)loadAnal();else{updateEvo('aevo-',analysisList.length,analysisList.length);document.getElementById('anal-quiz').style.display='none';document.getElementById('anal-result').style.display='block';boom()}}function finishAnal(early=false){document.getElementById('anal-quiz').style.display='none';document.getElementById('anal-result').style.display='block'}function resetAnal(){document.getElementById('anal-result').style.display='none';document.getElementById('anal-intro').style.display='block'}function recAnal(){const dk=todayKey();const h=safeGet(`${STORE}_anal`,{});if(!h[dk])h[dk]={count:0,last:0};h[dk].count++;h[dk].last=aIdx+1;h[dk].time=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});safeSet(`${STORE}_anal`,h)}
function renderHistory(){const div=document.getElementById('hist-list');div.innerHTML='';div.insertAdjacentHTML('beforeend','<div class="hist-category">단어 테스트</div>');const wh=safeGet(`${STORE}_word`,[]);if(!wh.length)div.insertAdjacentHTML('beforeend','<p style="color:#a0aec0;font-size:13px">기록 없음</p>');else wh.slice(0,5).forEach(r=>div.insertAdjacentHTML('beforeend',`<div class="hist-card"><div><div class="hist-date">${r.date} ${r.time||''}</div><div class="hist-score">${r.score}점 <span style="font-size:12px;color:#a0aec0">(${r.correct}/${r.total})</span></div></div></div>`));div.insertAdjacentHTML('beforeend','<div class="hist-category">영작 진행</div>');const dh=safeGet(`${STORE}_dict`,{});const dks=Object.keys(dh).sort((a,b)=>new Date(b)-new Date(a));if(!dks.length)div.insertAdjacentHTML('beforeend','<p style="color:#a0aec0;font-size:13px">기록 없음</p>');else dks.slice(0,5).forEach(k=>div.insertAdjacentHTML('beforeend',`<div class="hist-card"><div><div class="hist-date">${fmtKey(k)} ${dh[k].time||''}</div><div class="hist-score">${dh[k].last||0}번까지 / ${dh[k].count||0}개 성공</div></div></div>`));div.insertAdjacentHTML('beforeend','<div class="hist-category">문장 분석</div>');const ah=safeGet(`${STORE}_anal`,{});const aks=Object.keys(ah).sort((a,b)=>new Date(b)-new Date(a));if(!aks.length)div.insertAdjacentHTML('beforeend','<p style="color:#a0aec0;font-size:13px">기록 없음</p>');else aks.slice(0,5).forEach(k=>div.insertAdjacentHTML('beforeend',`<div class="hist-card"><div><div class="hist-date">${fmtKey(k)} ${ah[k].time||''}</div><div class="hist-score">${ah[k].last||0}번까지 / ${ah[k].count||0}개 완료</div></div></div>`))}
function renderReview(){const div=document.getElementById('rev-list');div.innerHTML='';const arr=safeGet(`${STORE}_wrong`,[]);if(!arr.length){div.innerHTML='<div style="padding:16px;text-align:center;color:var(--green);font-weight:900;background:#f0fff4;border-radius:10px">오답이 없습니다!</div>';return}arr.forEach((w,i)=>div.insertAdjacentHTML('beforeend',`<div class="wrong-item"><div><div class="wrong-en">${w.en}</div><div class="wrong-ko">${w.ko}</div></div><button class="del-btn" onclick="delWrong(${i})">외웠음</button></div>`))}function delWrong(i){const arr=safeGet(`${STORE}_wrong`,[]);arr.splice(i,1);safeSet(`${STORE}_wrong`,arr);renderReview()}function clearWrong(){if(confirm('오답을 전부 비울까요?')){localStorage.removeItem(`${STORE}_wrong`);renderReview()}}
updateEvo('devo-',0,sentenceList.length);updateEvo('aevo-',0,analysisList.length);
